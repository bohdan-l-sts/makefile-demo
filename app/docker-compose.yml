services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "${APP_PORT:-8088}:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # Node lives in a container too: no nvm, no host Node. Started on demand (`make dev`, `make assets`).
  node:
    image: node:22-alpine
    profiles: ["node"]
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    environment:
      npm_config_cache: /tmp/.npm
    volumes:
      - .:/var/www/html
    ports:
      - "${VITE_PORT:-5174}:5174"

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 3s
      retries: 30
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
